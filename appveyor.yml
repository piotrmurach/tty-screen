---
skip_commits:
  files:
    - "bin/**"
    - "*.md"
install:
  - SET PATH=C:\Ruby%ruby_version%\bin;%PATH%
  - ruby --version
  - gem --version
  - bundle install
build: off
test_script:
  - bundle exec rake ci
environment:
  matrix:
    - ruby_version: "200"
    - ruby_version: "200-x64"
    - ruby_version: "21"
    - ruby_version: "21-x64"
    - ruby_version: "22"
    - ruby_version: "22-x64"
    - ruby_version: "23"
    - ruby_version: "23-x64"
    - ruby_version: "24"
    - ruby_version: "24-x64"
    - ruby_version: "25"
    - ruby_version: "25-x64"
    - ruby_version: "26"
    - ruby_version: "26-x64"
    - ruby_version: "27"
      APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2022
    - ruby_version: "27-x64"
      APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2022
    - ruby_version: "30"
      APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2022
    - ruby_version: "30-x64"
      APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2022
    - ruby_version: "31"
      APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2022
    - ruby_version: "31-x64"
      APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2022
    - ruby_version: "32"
      APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2022
    - ruby_version: "32-x64"
      APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2022
    - ruby_version: "33"
      APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2026
    - ruby_version: "33-x64"
      APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2026
    - ruby_version: "34"
      APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2026
    - ruby_version: "34-x64"
      APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2026
    - ruby_version: "40-x64"
      APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2026
